<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reto Canvas · Logo DVD rebotando</title>
  <style>
    body {
      margin: 0;
      background-color: #f5ede1;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      text-align: center;
      color: #2b1d14;
    }
    .volver {
      display: inline-block;
      margin: 1rem 1.5rem 0;
      color: #6f4e37;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      color: #3a2418;
      margin: 0.6rem 0 1rem;
    }
    canvas {
      border: 3px solid #3a2418;
      border-radius: 6px;
      background-color: #000000;
      max-width: 90vw;
      height: auto;
    }
    p {
      max-width: 550px;
      margin: 1.2rem auto 2rem;
      color: #6f4e37;
    }
  </style>
</head>
<body>

  <a href="../../index.html" class="volver">← Volver al menú principal</a>
  <h1>Reto Canvas: logo DVD rebotando</h1>

  <canvas id="micanvas" width="800" height="600"></canvas>

  <p>
    El logo se mueve en los ejes X y Y al mismo tiempo y rebota contra las
    cuatro paredes del canvas de forma infinita, cambiando de color cada
    vez que golpea un borde — igual que el clásico screensaver de DVD.
  </p>

  <script>
    var canvas = document.getElementById("micanvas");
    var context = canvas.getContext("2d");

    var imagen = new Image();
    imagen.src = "img/logo-dvd.png";

    var anchoImg = 130;
    var altoImg = 130;

    // Posición inicial
    var x = Math.random() * (canvas.width - anchoImg);
    var y = Math.random() * (canvas.height - altoImg);

    // Velocidad en ambos ejes
    var dx = 2.5;
    var dy = 2;

    // Colores estilo "screensaver" para ir cambiando al rebotar
    var colores = ['#c48f5f', '#e05252', '#4caf50', '#4a90d9', '#e8b64a', '#a352d9'];
    var colorActual = colores[0];

    function cambiarColor() {
      colorActual = colores[Math.floor(Math.random() * colores.length)];
    }

    function dibujarConColor() {
      // Dibuja la imagen y le aplica un tono usando composición,
      // para que se note el cambio de color en cada rebote.
      context.save();
      context.drawImage(imagen, x, y, anchoImg, altoImg);
      context.globalCompositeOperation = "source-atop";
      context.fillStyle = colorActual;
      context.globalAlpha = 0.55;
      context.fillRect(x, y, anchoImg, altoImg);
      context.restore();
    }

    function animate() {
      requestAnimationFrame(animate);
      context.clearRect(0, 0, canvas.width, canvas.height);

      x += dx;
      y += dy;

      // Rebote en los bordes izquierdo/derecho
      if (x + anchoImg >= canvas.width || x <= 0) {
        dx = -dx;
        x = Math.max(0, Math.min(x, canvas.width - anchoImg));
        cambiarColor();
      }

      // Rebote en los bordes superior/inferior
      if (y + altoImg >= canvas.height || y <= 0) {
        dy = -dy;
        y = Math.max(0, Math.min(y, canvas.height - altoImg));
        cambiarColor();
      }

      dibujarConColor();
    }

    imagen.onload = function () {
      animate();
    };
  </script>

</body>
</html>
